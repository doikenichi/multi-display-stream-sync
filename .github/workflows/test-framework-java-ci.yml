name: Test Framework Java CI

on:
  pull_request:
    paths:
      - "config/**"
      - "test-framework/java/**"
      - ".github/workflows/test-framework-java-ci.yml"
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "test-framework/java/**"
      - ".github/workflows/test-framework-java-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Test Framework Java quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: test-framework/java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        run: ./gradlew clean qualityCheck

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-framework-java-quality-reports
          path: |
            test-framework/java/build/reports/
            test-framework/java/build/test-results/
          if-no-files-found: warn
