name: Required CI Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect changed modules
    runs-on: ubuntu-latest

    outputs:
      orchestration_api_changed: ${{ steps.filter.outputs.orchestration_api }}
      display_client_changed: ${{ steps.filter.outputs.display_client }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            orchestration_api:
              - 'streaming-lab-orchestration-api/**'
              - '.github/workflows/required-ci-gate.yml'
            display_client:
              - 'display-client/**'
              - '.github/workflows/required-ci-gate.yml'

  validate-orchestration-api:
    name: Validate Orchestration API
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestration_api_changed == 'true'

    defaults:
      run:
        working-directory: streaming-lab-orchestration-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Orchestration API quality gate
        run: ./gradlew clean spotlessCheck check test

  validate-display-client:
    name: Validate Display Client
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.display_client_changed == 'true'

    defaults:
      run:
        working-directory: display-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: display-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        working-directory: display-client
        run: npm run lint

      - name: Build Display Client
        working-directory: display-client
        run: npm run build

      - name: Build Docker image
        run: docker build -t display-client:test ./display-client

  required-ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate-orchestration-api
      - validate-display-client
    if: always()

    steps:
      - name: Evaluate required checks
        run: |
          echo "orchestration_api_changed=${{ needs.detect-changes.outputs.orchestration_api_changed }}"
          echo "display_client_changed=${{ needs.detect-changes.outputs.display_client_changed }}"
          echo "validate-orchestration-api result=${{ needs.validate-orchestration-api.result }}"
          echo "validate-display-client result=${{ needs.validate-display-client.result }}"

          if [[ "${{ needs.detect-changes.outputs.orchestration_api_changed }}" == "true" && "${{ needs.validate-orchestration-api.result }}" != "success" ]]; then
            echo "Orchestration API changed, but validation did not pass."
            exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.display_client_changed }}" == "true" && "${{ needs.validate-display-client.result }}" != "success" ]]; then
            echo "Display Client changed, but validation did not pass."
            exit 1
          fi

          echo "Required CI Gate passed."