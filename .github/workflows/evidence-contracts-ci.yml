name: evidence-contracts-ci

on:
  pull_request:
    paths:
      - "test-framework/contracts/**"
      - "test-framework/tools/**"
      - ".github/workflows/evidence-contracts-ci.yml"
  push:
    branches:
      - main
    paths:
      - "test-framework/contracts/**"
      - "test-framework/tools/**"
      - ".github/workflows/evidence-contracts-ci.yml"

jobs:
  evidence-contracts:
    name: Evidence contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        working-directory: ./test-framework/tools/evidence-contract-validator
        run: npm ci

      - name: Validate evidence contracts
        working-directory: ./test-framework/tools/evidence-contract-validator
        run: npm run test:evidence-contracts
